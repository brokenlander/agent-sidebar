# Herd in a workspace: the panel, the board and the Ctrl-b keys. The look is the workspace's own.
set -g mouse on
set -g focus-events on
set -g detach-on-destroy off
bind s choose-tree -Zs -O name
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind Tab switch-client -l
bind R source-file ~/.tmux.conf \; display " reloaded"
set -g @herd_loaded 1
set -g @agent_sidebar_open 1
set -g @agent_sidebar_key 'e'
set -g @agent_sidebar_sessions 'on'
set -g @agent_sidebar_idle_wait '30'
set -g @agent_sidebar_picker_key 'u'
bind a display-menu -T ' new agent ' -x C -y C 'Claude Code' c { run-shell -b "tmux display-popup -c '#{client_name}' -E -w 70% -h 60% -T ' new claude agent ' \"HERD_CLIENT='#{client_name}' ~/.local/bin/herd pick claude '#{pane_current_path}'\"" } 'OpenCode' o { run-shell -b "tmux display-popup -c '#{client_name}' -E -w 70% -h 60% -T ' new opencode agent ' \"HERD_CLIENT='#{client_name}' ~/.local/bin/herd pick opencode '#{pane_current_path}'\"" }
set -g @agent_sidebar_exclude 'scratch'
set -g @agent_sidebar_legend 'herd:;a new agent;u agents;e sidebar;b board;o reopen;B branch;r reset;q end agent;tmux:;s tree;d scratch;| split right;- split down'
bind q run-shell -b "~/.local/bin/herd endhere '#{session_id}'"
bind r confirm-before -p ' reset this agent: new conversation? (y/n)' "run-shell -b \"~/.local/bin/herd reset '#{session_id}' '#{window_id}'\""
bind o display-menu -T ' reopen ' -x C -y C 'Claude Code: pick a conversation' c { run-shell -b "HERD_CLIENT='#{client_name}' ~/.local/bin/herd reopen claude '#{pane_current_path}'" } 'OpenCode: the last one' o { run-shell -b "HERD_CLIENT='#{client_name}' ~/.local/bin/herd reopen opencode '#{pane_current_path}'" }
bind B run-shell -b "HERD_CLIENT='#{client_name}' ~/.local/bin/herd branch '#{window_id}'"
bind b if -F '#{==:#{window_name},board}' last-window { run-shell -b "~/forge/agent-sidebar/bin/agent-board open '#{session_id}'" }
run-shell -b '~/forge/agent-sidebar/sidebar.tmux'
bind d if -F "#{==:#{session_name},scratch}" detach-client 'display-popup -E -w 82% -h 82% -T "  scratch " "tmux new-session -A -s scratch"'
bind D detach-client
